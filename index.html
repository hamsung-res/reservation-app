<script>
const pages = ['homePage', 'calendarPage', 'timePage', 'formPage', 'completePage'];
const today = new Date();
today.setHours(0, 0, 0, 0);

let currentDate = new Date();
let selectedDate = null;
let selectedTime = null;
let reservedKeys = [];

const scriptUrl = 'https://script.google.com/macros/s/AKfycbwy_imd9uHlzHUo5PhuLZUCEFwt3BcNmE9risO2Yj6X9LLaeFpHSnYx1_ffv53LJtuUkw/exec';

function goToPage(pageId) {
  pages.forEach(id => document.getElementById(id).classList.add('hidden'));
  document.getElementById(pageId).classList.remove('hidden');

  if (pageId === 'calendarPage') {
    renderCalendar();
  }

  if (pageId === 'timePage') {
    updateSelectedDateText();
    loadReservedTimes();
  }

  if (pageId === 'formPage') {
    updateReservationSummary();
  }
}

function loadReservedTimes() {
  fetch(`${scriptUrl}?mode=list&t=${Date.now()}`)
    .then(res => res.json())
    .then(data => {
      reservedKeys = Array.isArray(data) ? data.map(String) : [];
      renderTimeButtons();
    })
    .catch(() => {
      reservedKeys = [];
      renderTimeButtons();
    });
}

function renderCalendar() {
  const year = currentDate.getFullYear();
  const month = currentDate.getMonth();

  const firstDay = new Date(year, month, 1);
  const lastDay = new Date(year, month + 1, 0);

  const startWeekday = firstDay.getDay();
  const totalDays = lastDay.getDate();

  document.getElementById('monthTitle').textContent =
    `${year}년 ${month + 1}월`;

  const grid = document.getElementById('calendarGrid');
  grid.innerHTML = '';

  for (let i = 0; i < startWeekday; i++) {
    grid.appendChild(document.createElement('div'));
  }

  for (let day = 1; day <= totalDays; day++) {
    const date = new Date(year, month, day);

    const btn = document.createElement('div');
    btn.className = 'day';
    btn.textContent = day;

    const isSunday = date.getDay() === 0;
    const isPast = date < today;

    if (isSunday || isPast) {
      btn.classList.add('disabled');
    } else {
      btn.onclick = () => selectDate(date);
    }

    if (selectedDate && isSameDate(date, selectedDate)) {
      btn.classList.add('selected');
    }

    grid.appendChild(btn);
  }
}

function changeMonth(direction) {
  currentDate.setMonth(currentDate.getMonth() + direction);
  renderCalendar();
}

function selectDate(date) {
  selectedDate = date;
  selectedTime = null;
  goToPage('timePage');
}

function getAvailableTimes() {
  const day = selectedDate.getDay();

  if (day >= 1 && day <= 5) {
    return ['오후 4시 30분'];
  }

  if (day === 6) {
    return ['오전 10시', '오후 3시'];
  }

  return [];
}

function makeReservationKey(date, time) {
  return `${formatDate(date)}_${time}`;
}

function renderTimeButtons() {
  const timeList = document.getElementById('timeList');
  timeList.innerHTML = '';

  const times = getAvailableTimes();

  times.forEach(time => {
    const key = makeReservationKey(selectedDate, time);

    if (!reservedKeys.includes(key)) {
      const button = document.createElement('button');

      button.className = 'time-btn';
      button.textContent = time;

      button.onclick = () => selectTime(time, button);

      timeList.appendChild(button);
    }
  });

  if (timeList.innerHTML === '') {
    timeList.innerHTML =
      '<p class="notice">예약 가능한 시간이 없습니다.</p>';
  }
}

function selectTime(time, button) {
  selectedTime = time;

  document.querySelectorAll('.time-btn')
    .forEach(btn => btn.classList.remove('selected'));

  button.classList.add('selected');

  setTimeout(() => {
    goToPage('formPage');
  }, 200);
}

function formatDate(date) {
  const days = ['일', '월', '화', '수', '목', '금', '토'];

  return `${date.getFullYear()}년 ${date.getMonth() + 1}월 ${date.getDate()}일 (${days[date.getDay()]})`;
}

function isSameDate(a, b) {
  return a.getFullYear() === b.getFullYear() &&
    a.getMonth() === b.getMonth() &&
    a.getDate() === b.getDate();
}

function updateSelectedDateText() {
  document.getElementById('selectedDateText').innerHTML =
    `선택한 날짜<br><strong>${formatDate(selectedDate)}</strong>`;
}

function updateReservationSummary() {
  document.getElementById('reservationSummary').innerHTML = `
    예약 날짜: <strong>${formatDate(selectedDate)}</strong><br>
    예약 시간: <strong>${selectedTime}</strong>
  `;
}

function completeReservation() {
  const name = document.getElementById('name').value.trim();
  const phone = document.getElementById('phone').value.trim();
  const region = document.getElementById('region').value.trim();

  if (!name) {
    alert('이름을 입력해 주세요.');
    return;
  }

  if (!phone) {
    alert('연락처를 입력해 주세요.');
    return;
  }

  if (!region) {
    alert('지역을 입력해 주세요.');
    return;
  }

  const reservation = {
    name,
    phone,
    region,
    date: formatDate(selectedDate),
    time: selectedTime
  };

  const saveUrl =
    `${scriptUrl}?date=${encodeURIComponent(reservation.date)}&time=${encodeURIComponent(reservation.time)}&name=${encodeURIComponent(reservation.name)}&phone=${encodeURIComponent(reservation.phone)}&region=${encodeURIComponent(reservation.region)}&t=${Date.now()}`;

  const img = new Image();
  img.src = saveUrl;

  showComplete(reservation);
}

function showComplete(reservation) {
  document.getElementById('completeSummary').innerHTML = `
    이름: <strong>${reservation.name}</strong><br>
    연락처: <strong>${reservation.phone}</strong><br>
    지역: <strong>${reservation.region}</strong><br>
    날짜: <strong>${reservation.date}</strong><br>
    시간: <strong>${reservation.time}</strong><br><br>
    예약 신청이 완료되었습니다.
  `;

  goToPage('completePage');
}

function resetReservation() {
  selectedDate = null;
  selectedTime = null;

  document.getElementById('name').value = '';
  document.getElementById('phone').value = '';
  document.getElementById('region').value = '';

  goToPage('homePage');
}

renderCalendar();
</script>
